<style>
:root{
  --navh:80px;
  --paper:#EDE6D8;
  --paper-raised:#F5F0E5;
  --paper-deep:#E4DBCA;
  --ink:#1F2A26;
  --body:#333333;
  --muted:#5E6560;
  --teal:#3D5A50;
  --teal-deep:#2A3F38;
  --teal-soft:rgba(61,90,80,.14);
  --rust:#B5651D;

  --display:"Lora",Georgia,"Times New Roman",serif;
  --sans:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Space Mono","SF Mono",Consolas,monospace;

  --s1:.5rem; --s2:.875rem; --s3:1.25rem; --s4:2rem; --s5:3rem; --s6:4.5rem; --s7:7rem;
  --ease:cubic-bezier(.23,1,.32,1);
  --maxw:1080px;
}

:lang(zh){
  --display:"Songti SC","Noto Serif CJK SC","STSong",serif;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}

*{box-sizing:border-box}
html{scrollbar-width:thin;scrollbar-color:rgba(61,90,80,.42) transparent;scroll-behavior:smooth}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(61,90,80,.42);border-radius:999px;border:4px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(61,90,80,.72);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
body{
  margin:0;
  background:var(--paper);
  color:var(--body);
  font-family:var(--sans);
  font-size:17px;
  font-weight:400;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3{font-family:var(--display);color:var(--ink);font-weight:500;line-height:1.14;letter-spacing:-.022em;text-wrap:balance;margin:0}
p{margin:0}
a{color:inherit}

/* ---------- topographic field ---------- */
.topo{position:absolute;inset:0;z-index:0;pointer-events:none;color:var(--teal);overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%)}
.topo svg{width:100%;height:100%;display:block}
.topo--dense{opacity:.34}
.topo--open{opacity:.24}
.topo::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 78% 62% at 30% 42%,rgba(237,230,216,.82) 0%,rgba(237,230,216,.30) 58%,rgba(237,230,216,0) 100%)}
.has-topo{position:relative;isolation:isolate}
.has-topo > .wrap{position:relative;z-index:1}

.page{position:relative}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:24px}

/* ---------- nav ---------- */
.page{padding-top:var(--navh)}
.nav{position:fixed;top:0;left:0;right:0;z-index:60;padding-block:15px;
  background:var(--paper);border-bottom:1px solid rgba(61,90,80,.20);
  transition:transform .34s var(--ease),box-shadow .3s var(--ease)}
.nav.is-hidden{transform:translateY(-104%)}
.nav.is-stuck{box-shadow:0 10px 26px rgba(31,42,38,.07)}
.nav__in{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.mark{transition:color .18s var(--ease);font-family:var(--display);font-size:clamp(1.5rem,2.2vw,1.9rem);font-weight:600;color:var(--ink);text-decoration:none;letter-spacing:-.02em;white-space:nowrap}
.mark span{color:var(--rust);transition:color .18s var(--ease)}
.mark:hover{color:var(--rust)}
.mark:hover span{color:var(--teal)}
.nav__links{display:flex;gap:var(--s2);margin-left:auto;align-items:center;flex-wrap:wrap}
.nav__links a{display:inline-flex;align-items:center;min-height:44px;font-size:.94rem;text-decoration:none;color:var(--muted);
  transition:color .18s var(--ease),background .18s var(--ease)}
.nav__links a:not(.btn){padding:.46em .85em;border-radius:999px;line-height:1.2}
.nav__links a:not(.btn):hover,.nav__links a:not(.btn):focus-visible{
  color:var(--paper-raised);background:var(--rust)}
.nav__links a.btn{justify-content:center;min-height:44px;color:var(--paper-raised);line-height:1.2}
.nav__links a.btn:hover{color:var(--paper-raised)}

.btn{
  display:inline-block;font-family:var(--sans);font-size:.95rem;font-weight:500;
  padding:.72em 1.35em;border-radius:6px;text-decoration:none;
  background:var(--teal);color:var(--paper-raised);border:1px solid var(--teal);
  transition:background .18s var(--ease),transform .12s var(--ease);
}
.btn:hover{background:var(--rust);border-color:var(--rust)}
.btn:active{transform:scale(.975)}
/* solid, not transparent: over the terrain the contour lines used to run
   straight through the button and it stopped reading as a surface */
.btn--ghost{background:var(--paper);color:var(--teal-deep);
  border:1px solid rgba(61,90,80,.38)}
.btn--ghost:hover{background:var(--rust);border-color:var(--rust);color:var(--paper-raised)}
a:focus-visible,button:focus-visible{outline:2px solid var(--rust);outline-offset:3px;border-radius:4px}

/* ---------- phone proportions ----------
   Every tap target clears 44px, the smallest type stops shrinking, and the
   section rhythm tightens so a page is a scroll rather than a hike. */
@media (max-width:700px){
  body{font-size:16px}
  .wrap{padding-inline:20px}
  .topo--dense{opacity:.22}
  .topo--open{opacity:.16}
  .sec{padding-block:var(--s5)}
  /* the closing and the footer share one screen */
  .page .close{padding-block:var(--s5) var(--s4)}
  .page .close h2{font-size:clamp(1.85rem,7.4vw,2.4rem);max-width:14ch}
  .page .close__sub{margin-top:var(--s2);font-size:1.12rem}
  .page .close__cta{margin-top:var(--s3)}
  .page .close__cta .btn{width:100%;text-align:center}
  .page .close__fine{margin-top:var(--s2);font-size:.9rem;line-height:1.5}
  .page .mark{padding-block:.18em}
  .page .foot{padding-block:var(--s4) var(--s4)}
  .page .foot__links{gap:.35rem var(--s2)}
  .page .foot__links a{padding:.78em .85em;font-size:1rem}
  .page .foot__legal{font-size:.82rem;line-height:2}
  .btn{padding:.85em 1.4em;font-size:1rem}
  .page .close__fine a{display:inline-block;padding:.7em .7em}
}
@media (max-width:420px){
  .wrap{padding-inline:16px}
}

/* ---------- the menu button, phone only ---------- */
.nav__toggle{display:none;margin-left:auto;width:46px;height:46px;padding:0;
  background:none;border:0;cursor:pointer;color:var(--ink);
  align-items:center;justify-content:center;border-radius:10px;
  transition:color .18s var(--ease),background .18s var(--ease)}
.nav__toggle:hover,.nav__toggle:focus-visible{color:var(--paper-raised);background:var(--rust)}
.nav__bars{display:block;width:22px;height:14px;position:relative}
.nav__bars::before,.nav__bars::after,.nav__bars i{content:"";position:absolute;left:0;right:0;
  height:2px;border-radius:2px;background:currentColor;
  transition:transform .26s var(--ease),opacity .18s var(--ease)}
.nav__bars::before{top:0} .nav__bars i{top:6px} .nav__bars::after{top:12px}
.nav.is-open .nav__bars::before{transform:translateY(6px) rotate(45deg)}
.nav.is-open .nav__bars i{opacity:0}
.nav.is-open .nav__bars::after{transform:translateY(-6px) rotate(-45deg)}
.nav__scrim{display:none}

/* Below 700px the four links wrapped under the wordmark and the header grew to
   ~200px, a quarter of a phone screen, while .page only reserved --navh. They
   move behind the menu button instead, which puts the bar back to one row and
   lets it hide on scroll again. */
@media (max-width:700px){
  :root{--navh:62px}
  .nav{padding-block:8px}
  .nav__toggle{display:flex}
  .mark{font-size:1.5rem}
  .nav__links{position:absolute;left:0;right:0;top:100%;margin-left:0;
    flex-direction:column;align-items:stretch;gap:4px;flex-wrap:nowrap;
    background:var(--paper);border-bottom:1px solid rgba(61,90,80,.26);
    box-shadow:0 20px 36px rgba(31,42,38,.16);
    padding:10px 20px var(--s3);max-height:0;overflow:hidden;visibility:hidden;
    transform-origin:top;opacity:0;transform:translateY(-8px) scaleY(.98);
    pointer-events:none;overscroll-behavior:contain;
    transition:opacity .22s var(--ease),transform .26s var(--ease),
      max-height .26s var(--ease),visibility 0s linear .26s}
  .nav.is-open .nav__links{opacity:1;transform:none;max-height:calc(100svh - var(--navh));
    visibility:visible;pointer-events:auto;overflow-y:auto;
    transition-delay:0s}
  .nav__scrim{display:block;position:fixed;inset:var(--navh) 0 0;z-index:50;
    background:rgba(31,42,38,.16);opacity:0;pointer-events:none;
    transition:opacity .26s var(--ease)}
  .nav.is-open + .nav__scrim{opacity:1;pointer-events:auto}
  .nav__links a:not(.btn),.nav__links a.btn{min-height:48px;display:flex;align-items:center}
  .nav__links a:not(.btn){padding:.85em .65em;border-radius:8px;font-size:1.06rem;
    color:var(--ink);border-bottom:1px solid rgba(61,90,80,.12)}
  .nav__links a:not(.btn):last-of-type{border-bottom:0}
  .nav__links a.btn{margin-top:8px;text-align:center;padding:.72em 1.35em;font-size:1.02rem;
    background:var(--teal);border-color:var(--teal)}
}

/* ---------- footer ---------- */
.foot{border-top:1px solid rgba(61,90,80,.22);padding-block:var(--s4) var(--s5);
  display:flex;gap:var(--s3) var(--s4);flex-wrap:wrap;justify-content:space-between;align-items:flex-start}
.foot__legal{font-family:var(--mono);font-size:.76rem;letter-spacing:.03em;color:var(--muted);line-height:1.9}
.foot__links{display:flex;gap:var(--s3);flex-wrap:wrap;font-size:.94rem}
.foot__links a{text-decoration:none;color:var(--muted);padding:.4em .8em;border-radius:999px;
  transition:color .18s var(--ease),background .18s var(--ease)}
.foot__links a:hover,.foot__links a:focus-visible{color:var(--paper-raised);background:var(--rust)}

/* ---------- holding page ---------- */
.soon{position:relative;isolation:isolate;overflow:hidden;
  min-height:calc(100vh - var(--navh));display:flex;align-items:center;justify-content:center}
.soon__in{position:relative;z-index:1;text-align:center;padding-block:var(--s6)}
.soon h1{font-size:clamp(2.2rem,5vw,3.4rem);letter-spacing:-.03em}

.lock{display:block;margin:clamp(26px,5vh,46px) auto 0;width:clamp(58px,7vw,78px);height:auto;
  overflow:visible;color:var(--teal)}
.lock__shackle,.lock__body,.lock__pin{fill:none;stroke:currentColor;stroke-width:5;
  vector-effect:non-scaling-stroke}
.lock__shackle,.lock__pin{stroke-linecap:round}
.lock__body{stroke-linejoin:round}

.soon__label{margin-top:clamp(22px,4vh,38px);font-family:var(--mono);
  font-size:clamp(.9rem,1.5vw,1rem);letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted)}

@media (max-width:700px){
  .soon{min-height:0;padding-block:var(--s6)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>

</head>

<script>
/* ---- header: hides on scroll down, returns on scroll up or when the
        cursor reaches the top of the window ---- */
(function(){
  var nav=document.querySelector('.nav'); if(!nav) return;
  var last=window.scrollY, ticking=false;

  function reveal(){ nav.classList.remove('is-hidden'); }

  /* Home only. The header ships with no surface so the hero terrain runs behind
     it. Two rules combine:

       going down from the top   the surface stays at 0 until the header has
                                 hidden, so it is never seen arriving
       coming back up            the surface is a direct function of how far
                                 from the top you are, over the last 100px

     That second rule is the whole point. Nothing is timed, so there is no
     duration to lag behind the scroll and no threshold to snap at: the fade IS
     the visitor's scroll, played back at whatever speed they move. */
  var home=document.querySelector('.page--home');
  var FADE=100, TOP=2, solid=false, menuOpen=false;

  function surface(y){
    if(!home) return;
    if(y<=TOP) solid=false;              /* back at the top, start bare again */
    var v = menuOpen ? 1 : (solid ? Math.min(1, y/FADE) : 0);
    nav.style.setProperty('--nav-surface', v.toFixed(3));
  }

  function upd(){
    var y=window.scrollY;
    nav.classList.toggle('is-stuck', y>10);
    if(menuOpen){ reveal(); }
    else if(y>last && y>160){ nav.classList.add('is-hidden'); solid=true; }
    else if(y<last-4){ reveal(); }
    surface(y);
    last=y; ticking=false;
  }
  /* a restored scroll position must not leave the links bare over content */
  if(home && window.scrollY>TOP) solid=true;
  surface(window.scrollY);
  window.addEventListener('scroll',function(){
    if(!ticking){ ticking=true; requestAnimationFrame(upd); }
  },{passive:true});

  /* reaching into the header's own band brings it back, and it then behaves
     normally: it stays until the next downward scroll. No sensor element, so
     nothing intercepts clicks on the page beneath. */
  var band=parseInt(getComputedStyle(document.documentElement)
              .getPropertyValue('--navh'),10) || 76;
  window.addEventListener('pointermove',function(e){
    if(e.clientY <= band && nav.classList.contains('is-hidden')){
      reveal();
      last=window.scrollY;
    }
  },{passive:true});

  /* the phone menu. the panel is a plain dropdown, so it closes on a link, on
     Escape, on a tap outside, and whenever the layout grows back past the
     breakpoint. */
  var tog=document.getElementById('navToggle'), panel=document.getElementById('navLinks'),
      scrim=document.getElementById('navScrim');
  if(tog&&panel){
    function setOpen(on){
      nav.classList.toggle('is-open',on);
      tog.setAttribute('aria-expanded',on?'true':'false');
      if(scrim) scrim.setAttribute('aria-hidden',on?'false':'true');
      if(on) reveal();
      /* the panel must never open over bare terrain */
      menuOpen=on; surface(window.scrollY);
    }
    tog.addEventListener('click',function(e){
      e.stopPropagation();
      setOpen(!nav.classList.contains('is-open'));
    });
    panel.addEventListener('click',function(e){
      if(e.target.closest('a')) setOpen(false);
    });
    if(scrim) scrim.addEventListener('click',function(){ setOpen(false); });
    /* pointerdown, not click: a tap does not reliably synthesise a click on
       an element with no handler of its own, so an outside tap was leaving the
       menu open on a phone. */
    document.addEventListener('pointerdown',function(e){
      if(nav.classList.contains('is-open') && !nav.contains(e.target)) setOpen(false);
    },true);
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape' && nav.classList.contains('is-open')){ setOpen(false); tog.focus(); }
    });
    window.addEventListener('resize',function(){
      if(window.innerWidth>700 && nav.classList.contains('is-open')) setOpen(false);
    },{passive:true});
  }

  /* Same-page calls ease into their target and leave it below the fixed
     header. Native anchor scrolling remains untouched everywhere else. */
  document.addEventListener('click',function(e){
    var link=e.target.closest('a[href^="#"]');
    if(!link) return;
    var id=link.getAttribute('href').slice(1), target=document.getElementById(id);
    if(!id||!target) return;
    e.preventDefault();
    target.scrollIntoView({
      behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',
      block:'start'
    });
    if(window.history&&window.history.pushState) window.history.pushState(null,'','#'+id);
  });
})();
</script>
