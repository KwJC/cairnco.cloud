<!DOCTYPE html>

__HEAD__
__META__

<style>
__SHELL_CSS__

/* ---------- the guides index ----------
   A list, nothing more. Title, one sentence, a date. Anything else here
   competes with the articles, which are the thing worth reading. */
.gix{position:relative;padding-block:var(--s5)}
.gix::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(61,90,80,.26) 12%,rgba(61,90,80,.26) 88%,transparent)}
.gix__head{max-width:34ch}
.gix__head h1{font-size:clamp(2.1rem,4.4vw,3.05rem);line-height:1.1;letter-spacing:-.032em}
.gix__sub{margin-top:var(--s3);font-size:1.06rem;line-height:1.55;color:var(--muted);max-width:54ch}

/* Each article is a full-width banner, built on the same parts as a Kit
   banner: paper-raised fill, hairline border, 14px radius, a contour field
   behind the words at .10 lifting to .26, and a solid terracotta fill on
   hover. The rows-with-hairlines version this replaces read as a list, which
   is what a hub of articles should NOT look like. */
.gix__list{margin-top:var(--s5);display:flex;flex-direction:column;gap:var(--s3)}

.gcard{position:relative;overflow:hidden;box-sizing:border-box;
  display:flex;align-items:center;gap:var(--s4);
  min-height:clamp(158px,15vw,200px);
  padding:var(--s4) clamp(1.5rem,2.6vw,2.25rem);
  text-decoration:none;color:inherit;background:var(--paper-raised);
  border:1px solid rgba(61,90,80,.30);border-radius:14px;
  transition:background .2s var(--ease),border-color .2s var(--ease),
    transform .12s var(--ease)}
.gcard:hover,.gcard:focus-visible{background:var(--rust);border-color:var(--rust)}
.gcard:active{transform:scale(.99)}

/* Texture, not decoration: it sits behind the words rather than competing. On
   hover the lines are paper on terracotta, so they read light, not dark. Each
   card shows a different window of the same field, set by its own viewBox in
   the markup, so no two cards carry identical lines. */
.gcard__topo{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  opacity:.10;transition:opacity .2s var(--ease)}
.gcard:hover .gcard__topo,.gcard:focus-visible .gcard__topo{opacity:.26}
.gcard__topo svg{width:100%;height:100%;display:block}

.gcard__words{position:relative;z-index:1;flex:1 1 auto;min-width:0}
.gcard__date{display:block;font-family:var(--mono);font-size:.72rem;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;color:var(--teal);
  transition:color .2s var(--ease)}
.gcard h2{margin:.7rem 0 0;font-family:var(--display);font-weight:500;
  font-size:clamp(1.45rem,2.9vw,2.05rem);line-height:1.14;letter-spacing:-.03em;
  color:var(--ink);max-width:24ch;transition:color .2s var(--ease)}
.gcard p{margin:.72rem 0 0;font-size:1.02rem;line-height:1.6;color:var(--body);
  max-width:54ch;transition:color .2s var(--ease)}
.gcard__go{position:relative;z-index:1;flex:none;display:inline-flex;align-items:center;
  gap:.55rem;font-size:.95rem;font-weight:500;color:var(--teal);
  transition:color .2s var(--ease)}
.gcard__go svg{width:15px;height:15px;flex:none;transition:transform .18s var(--ease)}
.gcard:hover .gcard__date,.gcard:focus-visible .gcard__date,
.gcard:hover h2,.gcard:focus-visible h2,
.gcard:hover p,.gcard:focus-visible p,
.gcard:hover .gcard__go,.gcard:focus-visible .gcard__go{color:var(--paper-raised)}
.gcard:hover .gcard__go svg,.gcard:focus-visible .gcard__go svg{transform:translateX(4px)}

/* The go link has nowhere to sit beside the words once the card narrows, so it
   drops under them and the card becomes a column. */
@media (max-width:860px){
  .gcard{flex-direction:column;align-items:flex-start;gap:var(--s3);
    min-height:0;padding:var(--s4) 1.25rem;border-radius:12px}
  .gcard h2,.gcard p{max-width:none}
}

.gix__none{margin-top:var(--s5);font-family:var(--mono);font-size:.8rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* No hover on a touch screen, so the card keeps its resting colours rather than
   sticking on terracotta after a tap. 820px is where The Kit draws the same
   line, so the two pages agree about what counts as a touch device. */
@media (max-width:820px){
  .gcard:hover{background:var(--paper-raised);border-color:rgba(61,90,80,.30)}
  .gcard:hover .gcard__date,.gcard:hover .gcard__go{color:var(--teal)}
  .gcard:hover h2{color:var(--ink)}
  .gcard:hover p{color:var(--body)}
  .gcard:hover .gcard__topo{opacity:.10}
}
@media (max-width:700px){
  .gix__head,.gix__sub{max-width:none}
  .gcard h2,.gcard p{max-width:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>

</head>

<body>
