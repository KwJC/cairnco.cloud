/* ---------- holding page ---------- */
.soon{position:relative;isolation:isolate;overflow:hidden;

.soon__in{position:relative;z-index:1;text-align:center;padding-block:var(--s6)}
.soon h1{font-size:clamp(2.2rem,5vw,3.4rem);letter-spacing:-.03em}

.lock{display:block;margin:clamp(26px,5vh,46px) auto 0;width:clamp(58px,7vw,78px);height:auto;
  overflow:visible;color:var(--teal)}
.lock__shackle,.lock__body,.lock__pin{fill:none;stroke:currentColor;stroke-width:5;
  vector-effect:non-scaling-stroke}
.lock__shackle,.lock__pin{stroke-linecap:round}
.lock__body{stroke-linejoin:round}

.soon__label{margin-top:clamp(22px,4vh,38px);font-family:var(--mono);
  font-size:clamp(.9rem,1.5vw,1rem);letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted)}

@media (max-width:700px){
  .soon{min-height:0;padding-block:var(--s6)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
